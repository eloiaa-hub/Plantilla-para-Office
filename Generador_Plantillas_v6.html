<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generador de plantillas v6</title>
<style>
:root{--bg:#eef0f3;--panel:#fff;--line:#d5d9e0;--tx:#1d2330;--mut:#616b7c;--ac:#2456c7;--ac-tx:#fff;--soft:#f4f6f9;--stage:#c9ced6;--warn-bg:#fff3d6;--warn-tx:#6d4c00;color-scheme:light}
:root[data-theme=dark]{--bg:#14171d;--panel:#1e222b;--line:#353b47;--tx:#e8ebf0;--mut:#a0a9b8;--ac:#6d97f2;--ac-tx:#0c1220;--soft:#272c36;--stage:#0d0f13;--warn-bg:#3f3213;--warn-tx:#f6d98c;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,"Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header.top h1{font-size:16px;margin:0;font-weight:650}
header.top small{color:var(--mut);font-size:12px;font-weight:400;margin-left:8px}
header.top .sp{flex:1}
button,.btn{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--soft);color:var(--tx);cursor:pointer;display:inline-block;text-decoration:none}
button:hover,.btn:hover{border-color:var(--ac)}
button.main{background:var(--ac);border-color:var(--ac);color:var(--ac-tx);font-weight:600}
input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
main{flex:1;display:flex;min-height:0}
aside{width:370px;flex:none;overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding:4px 16px 14px}
.stage{flex:1;overflow:auto;padding:18px;min-width:0;background:var(--stage)}
.pages{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start;justify-content:center}
.pagewrap{text-align:center;color:var(--tx);font-size:12px}
.pagewrap b{display:block;margin-bottom:5px;font-weight:600}
.sheet{position:relative;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.3);overflow:hidden;text-align:left;color:#222}
.sheet .abs{position:absolute}
.hf{position:absolute;display:flex;align-items:center;box-sizing:border-box;white-space:pre}
.hf span{flex:1;overflow:hidden}.hf span:nth-child(2){text-align:center}.hf span:nth-child(3){text-align:right}
.body{position:absolute;overflow:hidden}
.body p{margin:0}
details.sec{border-bottom:1px solid var(--line)}
details.sec>summary{cursor:pointer;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);font-weight:650;padding:12px 0;list-style:none;display:flex;align-items:center;gap:8px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"";width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s;flex:none;margin-left:2px}
details.sec[open]>summary::before{transform:rotate(45deg)}
details.sec[open]>summary{color:var(--tx)}
details.sec>div{padding:0 0 14px}
.row{display:flex;align-items:center;gap:8px;margin:6px 0;min-height:30px}
.row>label:first-child{flex:0 0 118px;font-size:13px}
.row input[type=text],.row input[type=number],.row select,#pfName{flex:1;min-width:0;width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--tx);font:inherit}
.row input[type=color]{width:44px;height:30px;padding:2px;border:1px solid var(--line);border-radius:6px;background:var(--panel);flex:none;cursor:pointer}
.row input[type=range]{flex:1;min-width:0;accent-color:var(--ac)}
.row .u{color:var(--mut);font-size:12px;flex:none;min-width:18px}
input[type=checkbox]{accent-color:var(--ac)}
.chk{display:flex;gap:7px;align-items:center;margin:6px 0;min-height:24px;font-size:13px}
.chk label{cursor:pointer}
h3{font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);margin:14px 0 4px;font-weight:650}
.note{font-size:12px;color:var(--mut);margin:6px 0}
.warn{background:var(--warn-bg);color:var(--warn-tx);border-radius:6px;padding:6px 9px;font-size:12.5px;margin:0 auto 12px;max-width:900px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.chips button{font-size:12px;padding:3px 8px}
.zones{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}
.zones input{width:100%;font:inherit;font-size:12px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--tx)}
.zones small{color:var(--mut);text-align:center}
.tree{font-size:12px;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:7px 9px;margin:4px 0}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.presets button{padding:7px 8px}
.hidden{display:none!important}
.tblgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:6px 0}
.tblbtn{padding:6px;display:flex;flex-direction:column;gap:4px;align-items:stretch;font-size:11px;line-height:1.15}
.tblbtn.on{outline:2px solid var(--ac);border-color:var(--ac)}
table.mini{width:100%;border-collapse:collapse;table-layout:fixed;background:#fff}
table.mini td{padding:3px 2px;height:11px}
table.mini i{display:block;height:3px;border-radius:1px}
.imgbox{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
@media(max-width:820px){main{flex-direction:column;overflow:auto}aside{width:auto;border-right:0;border-bottom:1px solid var(--line);overflow:visible}.stage{overflow:visible;padding:10px}}
</style>
</head>

  var FF=effFirst(C);
  groups.forEach(function(g,i){var n=i+1,kind=(i===0&&FF)?'first':n%2?'odd':'even',lab='Página '+n+(kind==='first'?' (primera)':kind==='odd'?' (impar)':' (par)');
    var w=document.createElement('div');w.className='pagewrap';w.innerHTML='<b>'+lab+'</b>';w.appendChild(renderPage(n,kind,groups.length,g));box.appendChild(w)});
  var W=[],P=C.page;
  var bgc=P.colorOn?P.color:'#FFFFFF';
  if(!P.img&&contrast(bgc,C.t.color)<4.5)W.push('El color del Texto contrasta poco con el fondo de página: costará leerlo.');
  if(P.img&&P.imgFade<60)W.push('La imagen de fondo está poco atenuada; comprueba que el texto se lee bien (prueba con «Atenuar imagen» al 70 % o más).');
  if(C.head.on&&C.head.deco==='band'&&C.head.band+3>P.top)W.push('La banda de la cabecera invade el texto: sube el margen superior a '+(C.head.band+5)+' mm o más.');
  if(C.foot.on&&C.foot.deco==='band'&&C.foot.band+3>P.bottom)W.push('La banda del pie invade el texto: sube el margen inferior a '+(C.foot.band+5)+' mm o más.');
  if(C.head.on&&C.head.deco==='band'&&contrast(C.head.color,C.head.txt)<4.5)W.push('El texto de la cabecera contrasta poco con su banda.');
  if(C.foot.on&&C.foot.deco==='band'&&contrast(C.foot.color,C.foot.txt)<4.5)W.push('El texto del pie contrasta poco con su banda.');
  document.getElementById('warns').innerHTML=W.map(function(w){return '<div class="warn">'+esc(w)+'</div>'}).join('');
}
var rT=null;
function refresh(deb){syncInputs();clearTimeout(rT);rT=setTimeout(function(){render();try{localStorage.setItem('plantilla_cfg',JSON.stringify(C))}catch(e){}},deb?60:0)}

/* ========== DESCARGAS ========== */
function dl(blob,name){var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},2000)}
function fname(){return (C.meta.file||'Plantilla').replace(/[\\/:*?"<>|]/g,'_')}
document.getElementById('bDotx').onclick=function(){bakeBg(C).then(function(bg){dl(buildDotx(C,bg),fname()+'.dotx')})};
document.getElementById('bOtt').onclick=function(){bakeBg(C).then(function(bg){dl(buildOtt(C,bg),fname()+'.ott')})};
document.getElementById('bSave').onclick=function(){dl(new Blob([JSON.stringify(C,null,1)],{type:'application/json'}),fname()+'_ajustes.json')};
document.getElementById('fLoad').addEventListener('change',function(e){var f=e.target.files[0];if(!f)return;f.text().then(function(s){try{C=merge(clone(DEF),JSON.parse(s));refresh()}catch(x){document.getElementById('warns').innerHTML='<div class="warn">Ese archivo de ajustes no se puede leer.</div>'}});e.target.value=''});
document.getElementById('bReset').onclick=function(){C=clone(DEF);refresh()};
/* ========== TEMA CLARO / OSCURO ========== */
(function(){var r=document.documentElement,t=null;try{t=localStorage.getItem('plantilla_tema')}catch(e){}
if(!t)t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';r.dataset.theme=t;
document.getElementById('bTheme').onclick=function(){r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('plantilla_tema',r.dataset.theme)}catch(e){}}})();
refresh();
</script>
